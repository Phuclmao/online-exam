server:
  port: 8080

spring:
  application:
    name: online-exam
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/online_exam?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate   # bảng do Flyway tạo, Hibernate chỉ kiểm tra
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-chars}
    expiration-ms: 86400000   # 1 ngày

springdoc:
  swagger-ui:
    path: /swagger-ui.html
